name: Deploy

# Manual on purpose: deploying spends money, so a person decides when it happens.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS
    # ARM, because the image is built here for ARM Fargate tasks.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 55
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - run: npm ci
      - run: npx cdk diff --no-notices
      - run: npx cdk deploy --require-approval never --no-notices --outputs-file outputs.json
      - run: cat outputs.json
