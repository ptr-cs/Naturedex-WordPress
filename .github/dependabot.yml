version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The WordPress, WP-CLI and Node base images. A WordPress bump also needs
  # WORDPRESS_VERSION in scripts/playground.mjs, so local tests run the same release.
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /
      - /infra
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns:
          - '*'
