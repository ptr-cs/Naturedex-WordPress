ServerTokens Prod
ServerSignature Off

# Features this site doesn't use. XML-RPC is refused in AWS WAF too, so the block
# doesn't depend on the edge. Scheduled work runs through WP-CLI, not wp-cron.php.
<FilesMatch "^(xmlrpc|wp-cron|wp-trackback|wp-links-opml|wp-signup|wp-activate|wp-mail)\.php$">
  Require all denied
</FilesMatch>

# Before the bootstrap task runs, the installer would let any visitor claim the
# site. Database upgrades run through WP-CLI: wp core update-db.
<LocationMatch "^/wp-admin/(install|setup-config|upgrade)\.php">
  Require all denied
</LocationMatch>

# Uploaded files must never run as code.
<Directory "/var/www/html/wp-content/uploads">
  <FilesMatch "\.(php|phtml|phar)$">
    Require all denied
  </FilesMatch>
</Directory>

<LocationMatch "^/wp-(content|includes)/">
  Header set Cache-Control "public, max-age=86400"
</LocationMatch>
