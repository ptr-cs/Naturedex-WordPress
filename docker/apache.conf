ServerTokens Prod
ServerSignature Off

# Refused here as well as in AWS WAF, so the block does not depend on the edge.
<Files "xmlrpc.php">
  Require all denied
</Files>

# Before the bootstrap task runs, this page would let any visitor claim the site.
<LocationMatch "^/wp-admin/(install|setup-config)\.php">
  Require all denied
</LocationMatch>

# Uploaded files must never run as code.
<Directory "/var/www/html/wp-content/uploads">
  <FilesMatch "\.(php|phtml|phar)$">
    Require all denied
  </FilesMatch>
</Directory>

<LocationMatch "^/wp-(content|includes)/">
  Header set Cache-Control "public, max-age=86400"
</LocationMatch>
